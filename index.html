<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- svgファイルを事前に読み込んでおくことでシームレスに表示 -->
  <link rel="preload" href="env/map/floor1.svg" as="image" />
  <link rel="preload" href="env/map/floor2.svg" as="image" />
  <link rel="preload" href="env/map/floor3.svg" as="image" />

  <!-- Google Fonts: Material Symbols -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <title>digital-pamphlet</title>
</head>

<body>
  <nav>
    <button id="nav-map-btn" class="active-page" data-theme="map">
      <span class="material-symbols-outlined">map</span>
      <span class="nav-label">マップ</span>
    </button>
    <button id="nav-booth-btn" data-theme="booth">
      <span class="material-symbols-outlined">storefront</span>
      <span class="nav-label">ブース</span>
    </button>
    <button id="nav-event-btn" data-theme="event">
      <span class="material-symbols-outlined">event</span>
      <span class="nav-label">イベント</span>
    </button>
    <button id="nav-help-btn" data-theme="help">
      <span class="material-symbols-outlined">help</span>
      <span class="help-label">ヘルプ</span>
    </button>
  </nav>

  <div id="map-page" class="page">
    <div id="map"></div>
  </div>
  <div id="booth-page" style="display: none" class="page">
    <div class="search-pane">
      <div class="search-input">
        <input type="text" placeholder="検索ワードを入力" />
        <span class="material-symbols-outlined">search</span>
      </div>

      <div class="categories-input">
        タグ:
        <span>指定なし</span>
      </div>

    </div>
    <button class="search-showmode material-symbols-outlined" id="booth-showmode">
      cards_stack
    </button>
    <div class="search-result-pane showstyle-list"></div>
  </div>
  <div id="event-page" style="display: none" class="page">
    <div class="event-search-pane">
      <button id="reload-event-btn">
        <span class="material-symbols-outlined">refresh</span>
        <span id="reload-event-btn-label">更新</span>
      </button>
      <span class="event-category">
        カテゴリ
        <select id="event-category-select">
          <option value="" selected>指定なし</option>
        </select>
      </span>
    </div>
    <div class="event-result-pane">
      <div class="event-time-pane">
        <span>開催時間</span>
        <hr class="small">
        <table class="event-times">
          <tbody>
            <tr class="soon">
              <th class="event-time-title">あああ</th>
              <td class="event-time-lefttime">5分後</td>
              <td class="event-time-next">次回: 00:00</td>
            </tr>
            <tr class="noheld">
              <th class="event-time-title">あああ</th>
              <td class="event-time-lefttime">30分後</td>
              <td class="event-time-next">次回: 00:00</td>
            </tr>
            <tr class="inheld">
              <th class="event-time-title">いいいいい</th>
              <td class="event-time-lefttime">開催中</td>
              <td class="event-time-next">終了: 00:00</td>
            </tr>
          </tbody>

        </table>
      </div>
      <div id="event-list" class="showstyle-list"></div>
    </div>
  </div>
  <div id="help-page" style="display: none" class="page">
    <iframe src="/env/help.html" frameborder="0"></iframe>
  </div>

  <script type="module" src="src/main.js"></script>
</body>

</html>
